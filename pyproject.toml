[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "try7z"
version = "1.0.1"
description = "A 7-Zip frontend for auto-extracting password-protected archives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tqdm>=4.65.0"]
authors = [{ name = "Author" }]
keywords = ["archive", "7z", "zip", "rar", "password", "extract"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "commitizen>=4.0.0",
    "pre-commit>=4.0.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
]

[project.scripts]
try7z = "try7z.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["try7z*"]

[tool.setuptools.package-data]
try7z = ["lib/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
files = ["try7z", "docs", "tests"]
exclude = [
    "^build/",
    "^dist/",
    "^htmlcov/",
    "^\\.tox/",
    "^\\.venv/",
    "^venv/",
]

[[tool.mypy.overrides]]
module = "sphinx.*"
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "try7z.*"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "benchmark_*.py"]
addopts = [
    "--cov=try7z",
    "--cov-report=term-missing",
    "--cov-report=html",
    "-m not benchmark",
]
markers = [
    "benchmark: Performance benchmark tests (pytest-benchmark)",
]

[tool.coverage.run]
source = ["try7z"]
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.commitizen]
version = "1.0.1"
version_files = [
    "pyproject.toml:version",
]
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true
annotated_tag = true
changelog_start_rev = "v0.5.0"
